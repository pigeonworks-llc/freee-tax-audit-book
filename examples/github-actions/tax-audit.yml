# Example GitHub Actions workflow for monthly tax-audit.
# Place under .github/workflows/ after adapting secrets and paths.
# Secrets to configure in the repository:
#   FREEE_COMPANY_ID, FREEE_CLIENT_ID, FREEE_CLIENT_SECRET
#   FREEE_TOKEN_JSON (optional: contents of token file)
#   ANTHROPIC_API_KEY (optional: for --vision)
#   GOOGLE_CHAT_WEBHOOK (optional)

name: monthly-tax-audit

on:
  schedule:
    # 1st of each month 00:00 UTC (~09:00 JST). Adjust as needed.
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      full_check:
        description: "Pass --full-check (reset duplicate cache judgment)"
        type: boolean
        default: false

jobs:
  tax-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Write freee token file
        env:
          FREEE_TOKEN_JSON: ${{ secrets.FREEE_TOKEN_JSON }}
        run: |
          mkdir -p "$HOME/.config/freee"
          if [ -n "$FREEE_TOKEN_JSON" ]; then
            printf '%s' "$FREEE_TOKEN_JSON" > "$HOME/.config/freee/token.json"
            chmod 600 "$HOME/.config/freee/token.json"
          fi

      - name: Run tax audit
        env:
          FREEE_COMPANY_ID: ${{ secrets.FREEE_COMPANY_ID }}
          FREEE_CLIENT_ID: ${{ secrets.FREEE_CLIENT_ID }}
          FREEE_CLIENT_SECRET: ${{ secrets.FREEE_CLIENT_SECRET }}
          FREEE_TOKEN_PATH: ${{ runner.temp }}/../.config/freee/token.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RECEIPT_DIR: receipts/incoming
          DUP_CACHE_PATH: ${{ runner.temp }}/duplicate-check.db
        run: |
          export FREEE_TOKEN_PATH="${HOME}/.config/freee/token.json"
          EXTRA=""
          if [ "${{ inputs.full_check }}" = "true" ]; then
            EXTRA="--full-check"
          fi
          # Entry path may be dist/src/index.js or dist/index.js depending on package layout.
          node dist/src/index.js tax-audit-report.md --monthly --vision $EXTRA || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tax-audit-report
          path: tax-audit-report.md
          if-no-files-found: ignore

      - name: Notify Google Chat (optional)
        if: always() && env.GOOGLE_CHAT_WEBHOOK != ''
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
        run: |
          if [ ! -f tax-audit-report.md ]; then
            SUMMARY="tax-audit-report.md missing"
          else
            SUMMARY=$(head -n 15 tax-audit-report.md)
          fi
          jq -n --arg t "[tax-audit] monthly run
${SUMMARY}" '{text: $t}' \
            | curl -sS -X POST "$GOOGLE_CHAT_WEBHOOK" \
                -H 'Content-Type: application/json' -d @-
