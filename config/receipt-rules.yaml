# Receipt exemption rules for tax audit checks.
# Deals matching these conditions are exempt from receipt attachment.

receipt_exemptions:
  # 法令: 少額特例（2023/10/1 - 2029/9/30）
  # 税込1万円未満の取引はインボイス保存不要
  small_amount_threshold: 10000

  # 実務: ゥ0 / ¥1 の認証チャージ等
  zero_amount_threshold: 1

  # 法令+実務: 勘定科目による免除
  # 旅費交通費: 公共交通機関特例（税込3万円未満）+ 出張旅費等特例
  # 支払手数料: 銀行振込手数料等
  exempt_account_items:
    - "旅費交通費"
    - "支払手数料"
    # 役員報酬・給与: 証憑は給与明細で別途管理
    - "役員報酬"
    - "給料手当"
    # 社会保険料: 納付書で別途管理
    - "法定福利費"
    - "健康保険料"
    - "介護保険料"
    - "厚生年金保険料"
    - "子ども・子育て拠出金"
    # 給与関連: 源泉徴収票で管理
    - "源泉所得税"
    - "年末調整"
    # 税金: e-Tax受信通知で管理
    - "国税"
    - "コクゼイ"
    - "ダイレクトノウフ"
    # 社会保険料: 年金事務所通知書で管理
    - "社会保険"
    - "シャカイホケン"
    - "シヤカイホケン"
