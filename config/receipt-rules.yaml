# 証憑添付チェック（E1）の設定。
#
# このチェックが見るのは「freee 上で取引と証憑が紐付いているか」であって、
# 電子帳簿保存法の保存要件そのものではない。電子取引データについて法令が
# 求めるのは、データを保存し税務調査等の際に提示・提出できる状態にして
# おくことであり、freee に添付することまでは求められていない。
#
#   - 検索要件は、基準期間の売上高が 5,000 万円以下、または出力書面を
#     取引年月日・取引先ごとに整理して提示できるなら不要（規4①）
#   - 改ざん防止措置は事務処理規程の策定・運用・備付けで足りる（規4①四）
#   - 規4③の猶予措置は「相当の理由」に人手不足・資金不足を挙げている
#   - EC サイトの領収書は、保存期間中サイト上で確認できるならダウンロード
#     保存すら要しない（一問一答【電子取引関係】問45）。ETC 利用証明書も
#     受領していないものを発行させてまで保存する必要はない（同 問46）
#
# したがってこれは、freee に証憑を集約する運用を選んだ事業者向けの設定である。
# 未紐付けは法令違反を意味しないため、既定では error ではなく warning とする。

receipt_check:
  # freee に証憑を集約する運用でなければ false にしてよい
  enabled: true
  # info / warning / error。既定は warning
  unattached_level: warning

receipt_exemptions:
  # 実務: ¥0 / ¥1 の認証チャージ等
  zero_amount_threshold: 1

  # 少額特例（税込1万円未満）による一律免除は既定では行わない。
  # 少額特例が免除するのは適格請求書の保存要件であって、所得税法・法人税法上の
  # 領収書等の保存義務ではない。金額だけを理由に外すと、本来確認すべき取引の
  # 大半が検出対象から落ちる。免除は下記のとおり取引の性質で行う。
  # small_amount_threshold: 10000

  # 性質による免除 1: 事業経費でない / 貸借対照表科目
  # freee の勘定科目カテゴリで判定する（account_items の account_category）
  exempt_account_categories:
    - "事業主"        # 事業主貸・事業主借
    - "他流動資産"
    - "他流動負債"
    - "固定負債"

  # 性質による免除 2: 勘定科目名
  exempt_account_items:
    # 領収書が発行されない
    - "旅費交通費"     # 公共交通機関特例（税込3万円未満）+ 出張旅費等特例
    - "支払手数料"     # 銀行振込手数料等
    # 別の証憑で管理
    - "役員報酬"       # 給与明細
    - "給料手当"       # 給与明細
    - "法定福利費"     # 納付書
    - "健康保険料"
    - "介護保険料"
    - "厚生年金保険料"
    - "子ども・子育て拠出金"
    - "源泉所得税"     # 源泉徴収票
    - "年末調整"
    - "国税"           # e-Tax 受信通知
    - "コクゼイ"
    - "ダイレクトノウフ"
    - "社会保険"       # 年金事務所通知書
    - "シャカイホケン"
    - "シヤカイホケン"

  # 性質による免除 3: 摘要に現れる文字列
  # 実務上インボイスを実際には保存しないもの
  exempt_description_patterns:
    - "振込手数料"
    - "ﾌﾘｺﾐﾃｽｳﾘﾖｳ"
    - "納付書"
