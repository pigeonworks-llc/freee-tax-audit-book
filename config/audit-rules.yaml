# Audit check tuning. Edited during annual/quarterly maintenance (see ch.12).
# Missing file or missing section = built-in defaults.

# E3 消費税区分チェック: 国外事業者から仕入れているサービスの名前。
# 名前が銀行明細やカード明細に現れ、かつ税区分が国内課税仕入のとき warning になる。
# 全角（ＡＷＳ）・大文字小文字は自動で吸収されるため、半角小文字で書けば足りる。
# pattern は正規表現。表示名を変えたいときだけ name を添える。
foreign_vendors:
  # クラウド・インフラ
  - aws
  - { pattern: 'google\s*cloud', name: Google Cloud }
  - azure
  - cloudflare
  - vercel
  - netlify
  - { pattern: 'digital\s*ocean', name: DigitalOcean }
  - heroku

  # 開発・AI
  - github
  - openai
  - anthropic
  - claude
  - cursor
  - xai
  - grok
  - gamma
  - superultra
  - replicate
  - huggingface
  - suno
  - { pattern: 'eleven\s*labs', name: ElevenLabs }
  - midjourney
  - perplexity

  # SaaS・業務ソフト
  - microsoft
  - adobe
  - zoom
  - slack
  - dropbox
  - notion
  - figma
  - canva
  - atlassian
  - { pattern: 'apple|itunes', name: Apple / iTunes }
  - spotify
  - { pattern: 'meta\s*platforms|facebook', name: Meta Platforms }
  - linkedin
  - x\s*corp
  - { pattern: 'craft\s*docs', name: Craft Docs }
  - evernote
  - grammarly
  - { pattern: '1password|agilebits', name: 1Password }
  - { pattern: 'garmin', name: Garmin }

  # 学習・書籍・メディア（配信元が海外法人のもの）
  - udemy
  - coursera
  - audible
  - { pattern: 'd\s*j\*|dow\s*jones|wsj', name: Dow Jones / WSJ }
  - { pattern: 'nyt|new\s*york\s*times', name: New York Times }
  - medium
  - substack

  # 請求主体が海外法人名義で表示されるもの
  # 例: Kindle 本や AWS の請求が「アマゾンサービシーズインターナショナル」名義で
  # カード明細に現れる。国内の Amazon.co.jp 名義とは請求主体が異なる。
  - { pattern: 'アマゾンサービシーズ|amazon\s*services', name: Amazon Services International }

  # 決済代行経由（請求主体が代行業者名で表示される）
  - stripe
  - paypal
  - cleverbridge
  - fastspring
  - paddle
  - beatport

# E5 重複取引チェック
#
# 重複は機械的に確定できない。同日・同額・同科目の取引が2件あることは、
# 二重計上の証拠にも、正当な2件の証拠にもなる。カード会社が同額を2回請求して
# いれば、取引が2件あるのが正しい状態になる。決め手は口座明細やレシートの
# 中身であって、グルーピングの一致ではない。
#
# そのため既定は error ではなく warning とし、削除の判断は人に委ねる。
# Vision API による精査も LLM 判定であり確定ではないため、同じレベルで報告する。
duplicate_check:
  # info / warning / error。既定は warning
  level: warning
  # 同日に複数発生することが常態の科目。件数だけ多く、実益が乏しいため対象外にする。
  exclude_account_items:
    - 旅費交通費
    - 支払手数料
  # この金額未満は対象外。数百円の交通費・手数料の偽陽性を抑える。
  min_amount: 1000
